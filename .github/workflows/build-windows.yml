name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          cache: true

      - name: Disable Analytics
        run: flutter --disable-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: |
          # Use MSBuild directly, bypassing the platform check
          # Flutter creates windows project files to match the package name CS_PRICE_SCANNER
          cd windows
          cmake -Bbuild -S. -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs-price-scanner-windows
          path: windows/build/Release/
